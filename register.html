<!DOCTYPE html>
<html lang="rw">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Register — Digital Encyclopedic Tech Ltd</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="site-header">
    <div class="wrap">
      <div class="brand">
        <h1>Digital Encyclopedic Tech Ltd</h1>
        <p class="tagline">Empowering Digital Skills & Technology Solutions</p>
      </div>
      <nav class="main-nav">
        <a href="index.html">Home</a>
        <a href="about.html">About</a>
        <a href="services.html">Services</a>
        <a href="register.html">Register</a>
        <a href="login.html">Login</a>
        <a href="contact.html">Contact</a>
      </nav>
    </div>
  </header>

  <main class="wrap main">
    <h2>Course Registration</h2>
    <form id="regForm" class="form">
      <label for="fullname">Full name</label>
      <input id="fullname" name="fullname" type="text" required />

      <label for="email">Email</label>
      <input id="email" name="email" type="email" required />

      <label for="phone">Phone</label>
      <input id="phone" name="phone" type="tel" required />

      <label for="course">Select Course</label>
      <select id="course" name="course" required>
        <option value="">-- Choose a course --</option>
        <option>Video Editing</option>
        <option>Graphics Design</option>
        <option>Networking & IP Addressing</option>
        <option>CCTV Installation & Configuration</option>
        <option>Irembo Services Training</option>
        <option>Computer Basics & Multimedia</option>
      </select>

      <label for="start">Preferred Start Date</label>
      <input id="start" name="start" type="date" required />

      <label for="password">Create Password</label>
      <input id="password" name="password" type="password" required />

      <button type="submit" class="btn primary">Register</button>
      <p id="regMsg" class="form-msg"></p>
    </form>
  </main>

  <footer class="site-footer">
    <div class="wrap">
      <div class="footer-left">
        <h4>Digital Encyclopedic Tech Ltd</h4>
        <p>Kigali, Rwanda • Tel: 0788426769 • Email: info@digitalencyclopedictech.rw</p>
      </div>
      <div class="footer-right">
        <small>© <span id="year4"></span> Digital Encyclopedic Tech Ltd</small>
      </div>
    </div>
  </footer>

  <script src="js/main.js"></script>
</body>
</html>
